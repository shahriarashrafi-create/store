name: Build MissionRank APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract project
        run: |
          mkdir project
          unzip MissionRank-Android-Source-Fixed.zip -d project
          echo "=== Project contents ==="
          find project -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Android project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MissionRank-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
